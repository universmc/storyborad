<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produit Professionnel</title>
    <!-- Intégration des styles et scripts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.172.0/three.tsl.js">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/groq-js@1.15.0/dist/index.min.js">
    <link rel="stylesheet" href="https://d3js.org/d3.v7.min.js">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- HTML.json -->
    <script type="application/json" id="model">
        {
            "pageWeb": {
                "type": "SinglePage",
                "style": "épuré, moderne",
                "topic": "Produit Professionnel"
            },
            "structure": {
                "variables": {
                    "productName": "Nom du produit",
                    "productDescription": "Description du produit",
                    "productPrice": "Prix du produit",
                    "ctaText": "Texte de l'appel à l'action"
                },
                "fonctions": {
                    "createProductCard": "Fonction pour créer la carte du produit avec les informations variables"
                },
                "evenements": {}
            },
            "exemples": {
                "generationDynamique": "Création d'une carte de produit à partir des informations variables",
                "personnalisation": "Ajout de styles et de classes pour personnaliser la carte du produit",
                "intégrationAI": "Utilisation d'une API d'intelligence artificielle pour générer des informations de produit"
            },
            "recommandations": {
                "templates": "Utilisation de templates pour générer la structure de la page de manière dynamique",
                "modularite": "Développement en modules pour une meilleure gestion et réutilisation du code",
                "optimisation": "Minimisation des requêtes HTTP pour améliorer les performances de la page",
                "accessibilite": "Respect des normes WCAG pour une meilleure accessibilité de la page"
            }
        }
    </script>

    <!-- CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f3f3;
        }

        .container {
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            width: 30rem;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            padding: 1em;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5em;
        }

        p {
            font-size: 0.9rem;
            margin-bottom: 1em;
        }

        .cta {
            display: inline-block;
            padding: 0.5em 1em;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
        }

        .cta:hover {
            background-color: #0062cc;
        }

        @media (max-width: 768px) {
            .card {
                width: 20rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="productCard" class="card"></div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>

</html>
