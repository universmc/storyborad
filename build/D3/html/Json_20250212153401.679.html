<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produit Professionnel</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
      }
      .produit {
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 2rem;
        background-color: #fff;
        max-width: 50rem;
        margin: 0 auto;
        margin-top: 5rem;
        position: relative;
      }
      .produit::before {
        content: "";
        position: absolute;
        height: 10rem;
        width: 10rem;
        border-radius: 50%;
        background: linear-gradient(to bottom right, #00a8ff, #ff5ee5);
        top: -5rem;
        left: calc(50% - 5rem);
      }
      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 2rem;
      }
      ul {
        list-style: none;
      }
      li {
        font-size: 1.1rem;
        line-height: 1.5;
        color: #555;
        margin-bottom: 1rem;
      }
      .call-to-action {
        background-color: #ff5ee5;
        color: #fff;
        padding: 1rem 2rem;
        border-radius: 5px;
        display: inline-block;
        text-decoration: none;
        font-size: 1.2rem;
        transition: all 0.3s;
      }
      .call-to-action:hover {
        background-color: #00a8ff;
      }
    </style>
  </head>
  <body>
    <div class="produit">
      <h1>Produit Professionnel</h1>
      <ul>
        <li>Caractéristique 1</li>
        <li>Caractéristique 2</li>
        <li>Caractéristique 3</li>
      </ul>
      <a href="#" class="call-to-action">Acheter Maintenant</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/groq-js@1.15.0/dist/index.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.172.0/three.tsl.js"></script>
    <script src="prompt.js"></script>
  </body>
</html>
